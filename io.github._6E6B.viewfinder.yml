# Local development manifest (directory sources).
# For Flathub, replace the dir source with a tagged git commit and keep cargo-sources.json.
id: io.github._6E6B.viewfinder
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: viewfinder
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.secrets
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - '*.la'
  - '*.a'
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/viewfinder/cargo
    CARGO_NET_OFFLINE: 'true'
modules:
  - name: viewfinder
    buildsystem: meson
    config-opts:
      - --buildtype=release
    sources:
      - type: dir
        path: .
      - flatpak/cargo-sources.json
      - type: shell
        commands:
          - mkdir -p .cargo
          - cp -f cargo/config .cargo/config.toml
